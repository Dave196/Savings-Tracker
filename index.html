<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Savings Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--ink:#edf2f7;--muted:#91a0b5;--card:#151f30;--green:#36d399;--line:#253349;--accent:#8b7cff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#17263b 0%,var(--bg) 45%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
main{max-width:480px;margin:auto;padding:18px 0 40px}.top{display:flex;justify-content:space-between;align-items:center;margin:8px 2px 22px}.brand{font-size:22px;font-weight:850;letter-spacing:-.7px}.brand span{color:var(--green)}.pill{font-size:12px;color:#b7f5dc;background:#143a35;padding:8px 12px;border:1px solid #24584e;border-radius:99px}
.hero{background:linear-gradient(135deg,#173b48,#203765 60%,#41316c);color:white;border:1px solid #334a70;border-radius:28px;padding:24px;margin-bottom:18px;box-shadow:0 18px 40px #0005}.hero small{opacity:.78;letter-spacing:1.4px;font-weight:700}.balance{font-size:38px;font-weight:780;margin:10px 0 18px;letter-spacing:-1.3px}.herofoot{display:flex;justify-content:space-between;font-size:13px;opacity:.9}
.actions{display:flex;gap:10px;margin-bottom:22px}.btn{border:0;border-radius:16px;padding:14px 16px;font-weight:750;font-size:15px;cursor:pointer;transition:transform .15s}.btn:active{transform:scale(.98)}.primary{background:var(--green);color:#05261b;flex:1;box-shadow:0 6px 18px #36d39922}.secondary{background:#202d43;color:#d9e5f5;border:1px solid #31435f}
h2{font-size:18px;margin:22px 4px 12px;letter-spacing:-.3px}.card{background:linear-gradient(145deg,#182438,#131d2d);border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:12px;box-shadow:0 8px 22px #0002}.potrow{display:flex;align-items:center;gap:12px}.dot{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 12px currentColor}.potinfo{flex:1;min-width:0}.potname{font-weight:720}.sub{color:var(--muted);font-size:12px;margin-top:5px}.potamt{text-align:right;font-weight:780;font-variant-numeric:tabular-nums}.bar{height:8px;background:#273449;border-radius:20px;margin-top:14px;overflow:hidden}.bar div{height:100%;border-radius:20px;box-shadow:0 0 12px #ffffff18}.split{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:11px;margin-top:9px}.modal{position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;padding:12px}.sheet{background:#111b2b;border:1px solid #2c3b52;width:min(480px,100%);border-radius:26px;padding:20px;max-height:90vh;overflow:auto;box-shadow:0 20px 60px #0008}.sheet h2{margin:4px 0 16px}.field{margin:12px 0}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input{width:100%;padding:14px;border:1px solid #34445c;border-radius:14px;font-size:17px;background:#1b2739;color:var(--ink)}.potedit{display:flex;gap:8px;align-items:center;margin:10px 0}.potedit input{padding:10px;border:1px solid #34445c;border-radius:12px;min-width:0;background:#1b2739;color:var(--ink)}.potedit .name{flex:1}.potedit .pct{width:82px}.notice{font-size:12px;color:var(--muted);line-height:1.6}.hist{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}.hist:last-child{border:0}.empty{color:var(--muted);text-align:center;padding:18px}.close{float:right;background:none;border:0;color:var(--ink);font-size:22px}.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#193b32;color:#e6fff6;padding:12px 18px;border:1px solid #2c6756;border-radius:99px;display:none}
</style></head><body><main>
<div class="top"><div class="brand">Savings<span>Tracker</span></div><div class="pill">Virtual savings</div></div>
<div class="hero"><small>Tracked savings total</small><div class="balance" id="total">£0.00</div><div class="herofoot"><span id="potcount">0 goals</span><span>Rules-based split</span></div></div>
<div class="actions"><button class="btn primary" onclick="openDeposit()">＋ Add deposit</button><button class="btn secondary" onclick="openManage()">⚙ Manage</button></div><div class="actions" style="flex-wrap:wrap"><button class="btn secondary" onclick="exportCSV()">Export CSV</button><button class="btn secondary" onclick="exportJSON()">Backup JSON</button><button class="btn secondary" onclick="withdrawPrompt()">Withdraw</button><button class="btn secondary" style="border-color:#a04455;color:#ffc0cb" onclick="resetTracker()">Clear data</button></div>
<h2>Your pots</h2><div id="pots"></div>
<h2>Recent activity</h2><div class="card" id="history"></div>
<p class="notice">Virtual tracker only — no bank connection or real money movement. Your data is saved locally in this browser. Export a backup regularly.</p>
</main>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div><div class="toast" id="toast"></div>
<script>
const colors=['#0d9488','#3b82f6','#a855f7','#f59e0b','#64748b','#e11d48','#22c55e'];
let pots=JSON.parse(localStorage.getItem('pp_pots')||'null')||[{name:'Car',pct:30,color:colors[0],balance:0},{name:'House',pct:25,color:colors[1],balance:0},{name:'Emergency fund',pct:25,color:colors[2],balance:0},{name:'Holiday',pct:20,color:colors[3],balance:0}];
let hist=JSON.parse(localStorage.getItem('pp_hist')||'[]');
function save(){localStorage.setItem('pp_pots',JSON.stringify(pots));localStorage.setItem('pp_hist',JSON.stringify(hist));render()}
function money(x){return x.toLocaleString('en-GB',{style:'currency',currency:'GBP'})}
function total(){return pots.reduce((a,p)=>a+p.balance,0)}
function render(){document.getElementById('total').textContent=money(total());document.getElementById('potcount').textContent=pots.length+' goal'+(pots.length===1?'':'s');let t=total();
document.getElementById('pots').innerHTML=pots.map(p=>`<div class="card"><div class="potrow"><div class="dot" style="background:${p.color}"></div><div class="potinfo"><div class="potname">${esc(p.name)}</div><div class="sub">${p.pct}% allocation</div></div><div class="potamt">${money(p.balance)}</div></div><div class="bar"><div style="width:${t?Math.min(100,p.balance/t*100):0}%;background:${p.color}"></div></div><div class="split"><span>${t?(p.balance/t*100).toFixed(1):'0.0'}% of tracked balance</span><span>Target ${p.pct}% of new deposits</span></div></div>`).join('');
document.getElementById('history').innerHTML=hist.length?hist.slice(0,8).map(h=>`<div class="hist"><div><b>${money(h.amount)}</b><div class="sub">${new Date(h.date).toLocaleDateString('en-GB')} · Deposit</div></div><div style="color:var(--green);font-weight:700">Allocated</div></div>`).join(''):'<div class="empty">No deposits yet. Add one to get started.</div>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function show(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').style.display='flex'}
function close(){document.getElementById('modal').style.display='none'}
function toast(s){let t=document.getElementById('toast');t.textContent=s;t.style.display='block';setTimeout(()=>t.style.display='none',2400)}
function openDeposit(){show(`<button class="close" onclick="close()">×</button><h2>Add a deposit</h2><div class="field"><label>Deposit amount (£)</label><input id="amt" type="number" min="0" step="0.01" placeholder="e.g. 1000" inputmode="decimal"></div><p class="notice" id="preview">Your current allocation rules will split this deposit.</p><button class="btn primary" style="width:100%" onclick="addDeposit()">Allocate deposit</button>`)}
function addDeposit(){let a=Number(document.getElementById('amt').value);if(!a||a<=0)return toast('Enter a deposit greater than zero');if(Math.round(pots.reduce((s,p)=>s+p.pct,0))!==100)return toast('Allocation percentages must total 100%');pots.forEach(p=>p.balance+=a*p.pct/100);hist.unshift({amount:a,date:new Date().toISOString()});save();close();toast('Deposit allocated across your pots')}
function openManage(){show(`<button class="close" onclick="close()">×</button><h2>Manage your pots</h2><p class="notice">Set percentages for future deposits. They must add up to exactly 100%.</p><div id="edits">${pots.map((p,i)=>`<div class="potedit"><input class="name" id="n${i}" value="${esc(p.name)}"><input class="pct" id="p${i}" type="number" min="0" max="100" value="${p.pct}" aria-label="Percent"><button onclick="removePot(${i})" title="Remove" style="border:0;background:none;color:#b91c1c;font-size:20px">×</button></div>`).join('')}</div><div id="sum" class="notice"></div><button class="btn secondary" style="width:100%;margin:8px 0" onclick="addPot()">＋ Add pot</button><button class="btn primary" style="width:100%" onclick="saveManage()">Save changes</button>`);updateSum()}
function updateSum(){let els=[...document.querySelectorAll('.pct')];let s=els.reduce((a,e)=>a+(Number(e.value)||0),0);let x=document.getElementById('sum');if(x)x.textContent='Total: '+s+'%'+(s===100?' ✓':' (must equal 100%)')}
function addPot(){if(pots.length>=10)return toast('Maximum 10 pots');pots.push({name:'New pot',pct:0,color:colors[pots.length%colors.length],balance:0});openManage()}
function removePot(i){if(pots.length<=1)return toast('Keep at least one pot');pots.splice(i,1);openManage()}
function saveManage(){let names=document.querySelectorAll('.name'),pct=document.querySelectorAll('.pct');let s=0;for(let i=0;i<pots.length;i++){pots[i].name=names[i].value.trim()||'Pot';pots[i].pct=Number(pct[i].value)||0;s+=pots[i].pct}if(s!==100)return toast('Percentages currently total '+s+'%. Set them to 100%.');save();close();toast('Pot rules saved')}

function withdrawPrompt(){show(`<button class="close" onclick="close()">×</button><h2>Withdraw money</h2><div class="field"><label>Choose a pot</label><select id="wpot" style="width:100%;padding:14px;border-radius:14px;background:#1b2739;color:var(--ink)">${pots.map((p,i)=>`<option value="${i}">${esc(p.name)} — ${money(p.balance)}</option>`).join('')}</select></div><div class="field"><label>Amount (£)</label><input id="wamt" type="number" min="0.01" step="0.01" inputmode="decimal" placeholder="Amount"></div><button class="btn primary" style="width:100%" onclick="doWithdraw()">Confirm withdrawal</button>`)}
function doWithdraw(){let i=Number(document.getElementById('wpot').value),a=Number(document.getElementById('wamt').value),p=pots[i];if(!p||!(a>0))return toast('Enter a valid amount');if(a>p.balance)return toast('That exceeds this pot’s balance');p.balance=Number((p.balance-a).toFixed(2));hist.unshift({amount:-a,date:new Date().toISOString(),type:'Withdrawal',pot:p.name});save();close();toast('Withdrawal recorded')}
function resetTracker(){if(!confirm('Clear all pot balances and activity and restore the default pots? This cannot be undone.'))return;pots=[{name:'Car',pct:30,color:colors[0],balance:0},{name:'House',pct:25,color:colors[1],balance:0},{name:'Emergency fund',pct:25,color:colors[2],balance:0},{name:'Holiday',pct:20,color:colors[3],balance:0}];hist=[];save();toast('Tracker cleared')}
function downloadBlob(content,type,filename){let blob=new Blob([content],{type});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function exportJSON(){downloadBlob(JSON.stringify({pots,hist,exportedAt:new Date().toISOString()},null,2),'application/json','savings-tracker-backup.json');toast('JSON backup exported')}
function exportCSV(){let rows=[['Savings Tracker export'],['Exported',new Date().toISOString()],[],['POTS'],['Pot','Allocation %','Balance (£)'],...pots.map(p=>[p.name,p.pct,p.balance.toFixed(2)]),[],['TRANSACTIONS'],['Date','Type','Pot/Note','Amount (£)'],...hist.map(h=>[h.date,h.type||'Deposit',h.pot||'',h.amount.toFixed(2)])];let csv=rows.map(row=>row.map(v=>{let s=String(v??'');return '"'+s.replace(/"/g,'""')+'"'}).join(',')).join('\r\n');downloadBlob(csv,'text/csv;charset=utf-8','savings-tracker.csv');toast('CSV exported')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});render();
</script></body></html>
